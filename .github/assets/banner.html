<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:400px;background:#09090b;font-family:Inter,sans-serif;color:#fff;overflow:hidden;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(70px)}
.g1{width:520px;height:340px;left:640px;top:-60px;background:radial-gradient(#d93b8c,transparent 70%);opacity:.55}
.g2{width:420px;height:300px;left:900px;top:180px;background:radial-gradient(#6b46ff,transparent 70%);opacity:.35}
.g3{width:360px;height:260px;left:-80px;top:220px;background:radial-gradient(#ff86c4,transparent 70%);opacity:.18}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px;mask:linear-gradient(90deg,transparent,#000 60%)}
.left{position:absolute;left:72px;top:64px;width:600px}
.logo{width:76px;height:76px;filter:drop-shadow(0 8px 24px #d93b8c66)}
h1{font:800 72px/1 'Inter Display',Inter;letter-spacing:-2px;margin-top:22px}
h1 span{background:linear-gradient(135deg,#ff86c4,#d93b8c);-webkit-background-clip:text;color:transparent}
p{font:500 24px/1.35 Inter;color:#c9c9d1;margin-top:16px}
p b{color:#fff;font-weight:700}
.chips{display:flex;gap:10px;margin-top:24px}
.chip{border:1.5px solid #d93b8c99;color:#ff9fd0;background:#d93b8c1a;border-radius:999px;padding:7px 16px;font:600 17px Inter}
.player{position:absolute;left:720px;top:70px;width:440px;height:248px;border-radius:18px;background:linear-gradient(135deg,#1d1a2b,#2a1430 55%,#14121c);border:1px solid #ffffff22;box-shadow:0 0 80px #d93b8c55,0 30px 60px #0008;overflow:hidden}
.player:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#ff86c455,transparent 45%),radial-gradient(circle at 75% 65%,#7b5cff44,transparent 45%)}
.play{position:absolute;left:50%;top:46%;width:66px;height:66px;margin:-33px;border-radius:50%;background:#fff;display:grid;place-items:center}
.play:after{content:"";border-left:22px solid #111;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.bar{position:absolute;left:20px;right:20px;bottom:22px;height:5px;border-radius:3px;background:#ffffff33}
.bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:3px;background:linear-gradient(90deg,#ff86c4,#d93b8c)}
.bar b{position:absolute;left:12%;width:9%;top:-3px;height:11px;border-radius:3px;background:#ffd36b;opacity:.9}
.badge{position:absolute;left:18px;top:16px;background:#d93b8c;font:700 14px Inter;padding:5px 10px;border-radius:8px}
.skip{position:absolute;left:18px;bottom:44px;background:#000a;border:1px solid #fff4;font:600 14px Inter;padding:7px 12px;border-radius:9px}
.page{position:absolute;width:118px;height:168px;border-radius:12px;background:#f2efe8;box-shadow:0 20px 40px #0009;padding:10px;display:flex;flex-direction:column;gap:8px}
.page i{flex:1;border-radius:4px;background:linear-gradient(160deg,#cfcac0,#9e978a)}
.p1{left:1100px;top:200px;transform:rotate(9deg)}
.p2{left:1050px;top:218px;transform:rotate(-4deg);background:#fff}
</style></head><body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="left">
<svg class="logo" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff86c4"/><stop offset="1" stop-color="#d93b8c"/></linearGradient></defs><rect x="2" y="2" width="92" height="92" rx="24" fill="#111114" stroke="#3a1b2c" stroke-width="2"/><path d="M27 27 L52 52 M65 27 L27 65" stroke="url(#g)" stroke-width="13" stroke-linecap="round"/><path d="M66 52 V78 M53 65 H79" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>
<h1>Hikka <span>Plus</span></h1>
<p>Плеєр аніме й читалка манґи та ранобе —<br>прямо на сторінках <b>hikka.io</b></p>
<div class="chips"><div class="chip">Аніме</div><div class="chip">Манґа</div><div class="chip">Манхва</div><div class="chip">Ранобе</div></div>
</div>
<div class="player"><div class="badge">▶ 3 нових</div><div class="play"></div><div class="skip">Пропустити опенінг ›</div><div class="bar"><i></i><b></b></div></div>
<div class="page p2"><i></i><i></i></div><div class="page p1"><i></i><i></i></div>
</body></html>
