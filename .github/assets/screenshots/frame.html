<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1440px;height:972px;background:#09090b;position:relative;overflow:hidden;font-family:Inter,sans-serif}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:900px;height:520px;left:-120px;top:-180px;background:radial-gradient(#d93b8c,transparent 70%);opacity:.45}
.g2{width:820px;height:520px;right:-160px;bottom:-200px;background:radial-gradient(#6b46ff,transparent 70%);opacity:.38}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:40px 40px}
.win{position:absolute;left:80px;top:64px;width:1280px;border-radius:16px;overflow:hidden;background:#141418;border:1px solid #ffffff1f;box-shadow:0 0 0 1px #000,0 40px 90px #000c,0 0 120px #d93b8c33}
.bar{height:44px;display:flex;align-items:center;padding:0 16px;gap:8px;background:linear-gradient(#1c1c22,#16161b);border-bottom:1px solid #ffffff14}
.dot{width:12px;height:12px;border-radius:50%}
.url{margin-left:auto;margin-right:auto;transform:translateX(-30px);height:28px;width:420px;border-radius:8px;background:#0c0c10;border:1px solid #ffffff14;color:#a5a5b0;font:500 14px Inter;display:flex;align-items:center;justify-content:center;gap:7px}
.url b{color:#ececf1;font-weight:600}
.ext{position:absolute;right:16px;top:9px;width:26px;height:26px}
img.shot{display:block;width:1280px;height:800px}
</style></head><body><div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>
<div class="win"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
<div class="url">🔒 <span><b>hikka.io</b>URLPATH</span></div>
<svg class="ext" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff86c4"/><stop offset="1" stop-color="#d93b8c"/></linearGradient></defs><rect x="2" y="2" width="92" height="92" rx="24" fill="#111114" stroke="#3a1b2c" stroke-width="2"/><path d="M27 27 L52 52 M65 27 L27 65" stroke="url(#g)" stroke-width="13" stroke-linecap="round"/><path d="M66 52 V78 M53 65 H79" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>
</div><img class="shot" src="SHOT"></div></body></html>
