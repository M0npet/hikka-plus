name: Build

# Кожен пуш у main — збірка й архіви як артефакти.
# Тег vX.Y.Z — те саме + реліз на GitHub із zip-архівами для Firefox і Chrome.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Перевірка типів
        run: npm run compile

      - name: Версія тегу = версія в package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Тег $GITHUB_REF_NAME не збігається з версією $PKG у package.json" >&2
            exit 1
          fi

      - name: Збірка й архіви
        run: |
          npm run zip
          npm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: hikka-plus-${{ github.sha }}
          path: .output/*.zip

      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip .output/*-firefox.zip .output/*-sources.zip \
            --title "Hikka Plus $GITHUB_REF_NAME" \
            --generate-notes
