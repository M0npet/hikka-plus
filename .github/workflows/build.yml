name: Build

# Кожен пуш у main — збірка й архіви як артефакти.
# Тег vX.Y.Z — те саме + реліз на GitHub із zip-архівами для Firefox і Chrome.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # E2E (e2e/, Playwright + мок мережі) — на кожен пуш у main і PR (бэклог 2e): регресії видно до живого тесту MK.
  # Окрема задача — збірку й реліз не блокує; на тегах і релізах не запускається (той самий код уже пройшов на main).
  e2e:
    if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Повний Chromium Playwright (у headless-shell розширень немає) — channel 'chromium' у e2e/*.spec.ts.
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: e2e-${{ github.sha }}
          path: .output/e2e
          include-hidden-files: true
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    env:
      # Ключі AMO для підпису Firefox (необов'язкові). На рівні job — щоб їх бачила умова if кроку.
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Перевірка типів
        run: npm run compile

      - name: Версія тегу = версія в package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Тег $GITHUB_REF_NAME не збігається з версією $PKG у package.json" >&2
            exit 1
          fi

      - name: Збірка й архіви
        env:
          # Клієнт OAuth Hikka (Налаштування → Застосунки на hikka.io). Без них синхронізація з Hikka просто прихована.
          WXT_HIKKA_CLIENT_REFERENCE: ${{ secrets.HIKKA_CLIENT_REFERENCE }}
          WXT_HIKKA_CLIENT_SECRET: ${{ secrets.HIKKA_CLIENT_SECRET }}
        run: |
          npm run zip
          npm run zip:firefox

      # Сховище артефактів спільне на всі приватні репо акаунта (500 MB безкоштовно) — якщо воно повне,
      # збірка не червоніє: на тегу файли все одно йдуть у реліз.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hikka-plus-${{ github.sha }}
          path: .output/*.zip
          # .output — прихована тека (з крапкою); upload-artifact v4.4+ без цього нічого не вивантажує.
          include-hidden-files: true
          # Тестові збірки довго не тримаємо — бережемо безкоштовні 500 MB сховища.
          retention-days: 14

      # Підпис для Firefox (AMO). Канал — у файлі store/amo/channel:
      #   unlisted — самостійне поширення (.xpi у реліз), сторінки в каталозі немає;
      #   listed   — нова версія на сторінку AMO (вихідники + нотатки рецензенту з store/amo/reviewer-notes.md);
      #              підписаний .xpi чекаємо до 15 хв — перевірка AMO буває довшою, тоді реліз іде без .xpi;
      #   web      — CI не підписує: версію MK завантажує сам у формі AMO (перша listed-версія — опис і скріншоти там).
      # Ключі: addons.mozilla.org → Developer Hub → Manage API Keys → секрети репо AMO_API_KEY / AMO_API_SECRET.
      # Без секретів крок пропускається, реліз виходить як раніше (лише zip).
      - name: Підпис Firefox (AMO)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_API_KEY != ''
        run: |
          CHANNEL="$(tr -d '[:space:]' < store/amo/channel)"
          echo "Канал AMO: $CHANNEL"
          if [ "$CHANNEL" = "web" ]; then
            echo "store/amo/channel = web — підпис у CI пропущено, версію завантажити у формі AMO."
            exit 0
          fi
          if [ "$CHANNEL" != "listed" ] && [ "$CHANNEL" != "unlisted" ]; then
            echo "Невідомий канал «$CHANNEL» у store/amo/channel (listed | unlisted | web)" >&2
            exit 1
          fi
          # Зайві пробіли/переноси при копіюванні ключів ламають підпис JWT («Error decoding signature»).
          KEY="$(printf '%s' "$AMO_API_KEY" | tr -d '[:space:]')"
          SECRET="$(printf '%s' "$AMO_API_SECRET" | tr -d '[:space:]')"
          echo "Довжина ключа: ${#KEY} (має бути на кшталт user:12345678:123), секрету: ${#SECRET} (зазвичай 64)"
          EXTRA=()
          if [ "$CHANNEL" = "listed" ]; then
            # Для оновлень listed-версії — лише поля версії: ліцензія й нотатки рецензенту.
            node -e "const fs=require('fs');fs.writeFileSync('.output/amo-metadata.json',JSON.stringify({version:{license:'MIT',approval_notes:fs.readFileSync('store/amo/reviewer-notes.md','utf8')}}))"
            EXTRA=(--amo-metadata .output/amo-metadata.json)
          fi
          set +e
          npx --yes web-ext@10 sign \
            --source-dir .output/firefox-mv2 \
            --artifacts-dir .output/signed \
            --channel "$CHANNEL" \
            "${EXTRA[@]}" \
            --upload-source-code "$(ls .output/*-sources.zip)" \
            --api-key "$KEY" \
            --api-secret "$SECRET" \
            --approval-timeout 900000 2>&1 | tee .output/sign.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ $CODE -ne 0 ]; then
            # listed: версія вже на AMO, просто ще на перевірці (тайм-аут очікування) — реліз не валимо.
            if [ "$CHANNEL" = "listed" ] && grep -qi 'timeout' .output/sign.log; then echo "::warning::AMO ще не підписав listed-версію — реліз без .xpi (з'явиться на AMO після перевірки)"; exit 0; fi
            exit $CODE
          fi
          # Зрозуміла назва замість випадкової від AMO.
          VER="$(node -p "require('./package.json').version")"
          mv .output/signed/*.xpi ".output/signed/hikka-plus-$VER-firefox-signed.xpi"
          ls -l .output/signed

      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Реліз можна створити і тегом із ПК, і кнопкою/API на GitHub — архіви додаються в обох випадках.
        run: |
          shopt -s nullglob
          FILES=(.output/*-chrome.zip .output/*-firefox.zip .output/*-sources.zip .output/signed/*.xpi)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "Hikka Plus $GITHUB_REF_NAME" --generate-notes
          fi
